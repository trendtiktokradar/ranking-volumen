name: Recolectar ranking
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
concurrency: { group: collect, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node collector/index.js
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          FEES_ENABLED: '0'
      - name: Publicar en la rama data
        run: |
          mkdir /tmp/out && cp public/data/coins.json public/data/coins.csv /tmp/out/
          cd /tmp/out && git init -q -b data
          git config user.name  "${GIT_AUTHOR_NAME:-ranking-bot}"
          git config user.email "${GIT_AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add . && git commit -qm "datos $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
        env:
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
